version: '3.8'

services:
  maps:
    build: .
    container_name: "ATP-Maps-${CONTAINERSUFFIX}"
    env_file:
      - .env
    ports:
      - "${PORT}:8000"
    volumes:
      # This is the folder you can drop your initial KML/KMZ files into.
      - ./data:/app/data
    restart: unless-stopped

  ais-worker:
    build: .
    command: python ais_worker.py
    environment:
      - AIS_API_KEY=${AIS_API_KEY}
    volumes:
      - ./data:/app/data
    restart: always
    



  telegram-userbot:
    build: .
    command: python telegram_userbot_scraper.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always
